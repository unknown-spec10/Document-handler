<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Shield Base Contour -->
  <path d="M32 9 L49 15 C49 31 38.5 44 32 51 C25.5 44 15 31 15 15 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.22" 
        stroke="url(#shieldGrad)" 
        stroke-width="1.8" 
        stroke-linejoin="round" />

  <!-- Policy Document Page -->
  <g filter="url(#subtleShadow)">
    <path d="M24 19 H36 L43 26 V43 C43 44.1 42.1 45 41 45 H24 C22.9 45 22 44.1 22 43 V21 C22 19.9 22.9 19 24 19 Z" 
          fill="url(#docGrad)" />
    <!-- Folded Corner -->
    <path d="M36 19 V26 H43 Z" fill="#94a3b8" />
  </g>

  <!-- Document Line Accents -->
  <line x1="26" y1="28" x2="33" y2="28" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="33" x2="39" y2="33" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  <line x1="26" y1="38" x2="36" y2="38" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />

  <!-- Verified Security Badge -->
  <circle cx="43" cy="43" r="7.5" fill="url(#accentGrad)" stroke="#0f172a" stroke-width="2" />
  <path d="M39.5 43 L41.8 45.2 L46.2 40.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>