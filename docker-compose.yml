name: dms

services:
  db:
    image: postgres:15-alpine
    container_name: dms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: dms-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    image: deepdocker2023/dms-backend:latest
    container_name: dms-backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  updater:
    image: docker:cli
    container_name: dms-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    working_dir: /app
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache python3 > /dev/null 2>&1
        exec python3 -u -c '
        import http.server, subprocess, sys

        class UpdateHandler(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                if self.path == "/v1/update":
                    auth = self.headers.get("Authorization", "")
                    if auth != "Bearer dms_secure_update_token_123":
                        self.send_response(401)
                        self.end_headers()
                        return
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(b"{\"status\":\"update_in_progress\"}")
                    print("[Updater] Step 1/2: Pulling latest image from Docker Hub...", flush=True)
                    subprocess.run(["docker", "pull", "deepdocker2023/dms-backend:latest"])
                    print("[Updater] Step 2/2: Recreating backend container...", flush=True)
                    subprocess.run(["docker", "compose", "up", "-d", "--no-deps", "backend"])
                    print("[Updater] Update finished successfully!", flush=True)
                else:
                    self.send_response(404)
                    self.end_headers()

            def log_message(self, format, *args):
                print(f"[Updater HTTP] {args[0]} - {args[1]}", flush=True)

        server = http.server.HTTPServer(("0.0.0.0", 8080), UpdateHandler)
        print("[Updater] Dedicated DMS Updater service active on port 8080", flush=True)
        server.serve_forever()
        '

volumes:
  pgdata:

